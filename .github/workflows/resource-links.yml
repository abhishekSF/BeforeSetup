name: Weekly resource health
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:links
      - run: npm run check:links
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-link-report
          path: reports/resource-links.json
