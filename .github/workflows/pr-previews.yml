name: PR website previews

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to preview"
        required: true
        type: string
      ref:
        description: "Branch or commit SHA to preview"
        required: true
        type: string
      title:
        description: "Optional label shown on the preview dashboard"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-preview:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
      PREVIEW_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
    steps:
      - name: Require a numeric PR number
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR_NUMBER must be digits, got: $PR_NUMBER" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PREVIEW_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static PR preview
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE_PATH: /BeforeSetup/previews/pr-${{ env.PR_NUMBER }}
          NEXT_PUBLIC_SITE_URL: https://abhisheksf.github.io/BeforeSetup/previews/pr-${{ env.PR_NUMBER }}
        run: npm run build:pages
      - name: Export uses the PR preview asset prefix
        run: |
          test -f out/index.html
          grep -q "/BeforeSetup/previews/pr-${PR_NUMBER}/_next/" out/index.html
      - name: Upload preview build
        uses: actions/upload-artifact@v4
        with:
          name: pr-preview-${{ env.PR_NUMBER }}
          path: out
          include-hidden-files: true
          retention-days: 3

  publish-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
      PR_TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.title || github.event.pull_request.title }}
      PR_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.ref }}
      PR_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}
      PR_URL: https://github.com/${{ github.repository }}/pull/${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require a numeric PR number
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR_NUMBER must be digits, got: $PR_NUMBER" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: pr-preview-${{ env.PR_NUMBER }}
          path: out
      - name: Publish preview and rebuild dashboard
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site

          target="site/previews/pr-${PR_NUMBER}"
          rm -rf "$target"
          mkdir -p "$target"
          cp -a out/. "$target/"
          rm -f "$target/.nojekyll"
          mkdir -p site/previews
          node src/scripts/preview-dashboard.mjs site/previews

          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No preview changes to publish"
            exit 0
          fi
          git commit -m "Publish preview for PR #${PR_NUMBER}"
          git push origin gh-pages
      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const preview = `https://abhisheksf.github.io/BeforeSetup/previews/pr-${number}/`;
            const dashboard = "https://abhisheksf.github.io/BeforeSetup/previews/";
            const marker = "<!-- beforesetup-pr-preview -->";
            const body = [
              marker,
              `**Preview:** ${preview}`,
              `**Dashboard:** ${dashboard}`,
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }

  remove-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Require a numeric PR number
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR_NUMBER must be digits, got: $PR_NUMBER" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Remove closed PR preview and rebuild dashboard
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          rm -rf "site/previews/pr-${PR_NUMBER}"
          mkdir -p site/previews
          node src/scripts/preview-dashboard.mjs site/previews

          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No preview cleanup needed"
            exit 0
          fi
          git commit -m "Remove preview for PR #${PR_NUMBER}"
          git push origin gh-pages
